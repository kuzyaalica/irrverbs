<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISECLUB's Irregular verbs</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4ebd9; 
            --paper-bg: #fffbf2; 
            --text-main: #4a3e3d;
            --accent-color: #b87d4b;
            --accent-hover: #9e6536;
            --border-color: #decbb7;
            --shadow: 0 8px 20px rgba(139, 115, 85, 0.12);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Контейнер поиска — виден только в главном меню */
        .search-container {
            width: 100%;
            max-width: 950px;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--paper-bg);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Экраны */
        .screen {
            display: none;
            width: 100%;
            max-width: 950px;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Сетка меню */
        .verbs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            width: 100%;
            margin-bottom: 40px;
        }

        .verb-item-btn {
            background: var(--paper-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .verb-item-btn:hover {
            border-color: var(--accent-color);
            background-color: #fffefb;
            box-shadow: 0 4px 10px rgba(184, 125, 75, 0.15);
        }

        /* Обертка карточки */
        .card-wrapper {
            width: 100%;
            perspective: 1000px;
            overflow: hidden;
            margin-top: 10px;
        }

        /* Карточка — теперь занимает еще больше места сверху */
        .card-container {
            position: relative;
            width: 100%;
            height: 72vh;
            min-height: 520px;
            background: var(--paper-bg);
            border-radius: 6px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            border: 1px solid #ebd9c5;
            
            background-image: linear-gradient(#e1d3be 1px, transparent 1px);
            background-size: 100% 2.8rem;
            background-position: 0 0.5rem;
            
            transform: translateX(0) scale(1);
            opacity: 1;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        /* Анимации вылета */
        .card-container.slide-out-left { transform: translateX(-100%) scale(0.95); opacity: 0; }
        .card-container.slide-out-right { transform: translateX(100%) scale(0.95); opacity: 0; }
        .card-container.slide-in-left { transform: translateX(-100%) scale(0.95); opacity: 0; transition: none; }
        .card-container.slide-in-right { transform: translateX(100%) scale(0.95); opacity: 0; transition: none; }

        /* Глаголы внутри карточки */
        .forms-display {
            font-family: 'Comic Neue', cursive;
            font-weight: 700;
            font-size: 4.8rem;
            text-align: center;
            letter-spacing: 1px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
            z-index: 2;
        }

        .form-item {
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.2s ease;
            padding: 0 5px;
        }

        .form-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .form-1 { color: #b84a39; }
        .form-2 { color: #2e6b9e; }
        .form-3 { color: #2e8b57; }

        /* Перевод */
        .translation-box {
            position: relative;
            margin-top: 35px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80%;
            z-index: 2;
        }

        .translation {
            font-family: 'Comic Neue', cursive;
            font-style: italic;
            font-size: 3.2rem;
            color: #5c4a43;
            font-weight: 700;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
            text-align: center;
            position: relative;
            padding-bottom: 5px;
        }

        .translation.visible {
            opacity: 1;
            transform: scale(1);
        }

        .translation::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 3px;
            background-color: var(--accent-color);
            transition: width 0.4s ease 0.1s, left 0.4s ease 0.1s;
        }

        .translation.visible::after {
            width: 100%;
            left: 0;
        }

        /* Оценка A+ */
        .grade-badge {
            position: absolute;
            top: 25px;
            right: 30px;
            font-family: 'Comic Neue', cursive;
            font-size: 3.8rem;
            font-weight: 700;
            color: #d32f2f;
            border: 4px double #d32f2f;
            padding: 2px 12px;
            transform: rotate(12deg) scale(0);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.3), opacity 0.3s ease;
            user-select: none;
            z-index: 3;
            background: var(--paper-bg);
            border-radius: 4px;
        }

        .grade-badge.visible {
            transform: rotate(12deg) scale(1);
            opacity: 0.85;
        }

        /* Панель управления */
        .bottom-controls-row {
            margin-top: 25px;
            width: 100%;
            display: grid;
            grid-template-columns: 45px 1fr 105px;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .back-to-menu-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            width: 45px;
            height: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-to-menu-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .center-action-area {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .action-btn {
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background-color: var(--accent-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(184, 125, 75, 0.2);
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
            white-space: nowrap;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .nav-btn-container {
            display: flex;
            visibility: hidden;
            gap: 15px;
            justify-content: flex-end;
        }

        .nav-btn-container.visible {
            visibility: visible;
        }

        .nav-arrow {
            background: var(--paper-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 4px;
            width: 45px;
            height: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .nav-arrow:hover {
            background: var(--accent-color);
            color: white;
        }
    </style>
</head>
<body>

    <div id="searchWrapper" class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск глагола (форма 1, 2, 3) или перевода..." oninput="filterVerbs()">
    </div>

    <div id="menuScreen" class="screen active">
        <div class="verbs-grid" id="verbsGrid"></div>
    </div>

    <div id="cardScreen" class="screen">
        <div class="card-wrapper">
            <div class="card-container" id="cardContainer">
                <div class="grade-badge" id="gradeBadge">A+</div>

                <div class="forms-display">
                    <span class="form-item form-1" id="f1"></span>
                    <span class="form-item form-2" id="f2"></span>
                    <span class="form-item form-3" id="f3"></span>
                </div>

                <div class="translation-box">
                    <div class="translation" id="transText"></div>
                </div>
            </div>
        </div>

        <div class="bottom-controls-row">
            <button class="back-to-menu-btn" onclick="showMenu()">&lt;</button>
            
            <div class="center-action-area">
                <button class="action-btn" id="actionBtn" onclick="nextStep()">Показать форму</button>
            </div>

            <div class="nav-btn-container" id="navContainer">
                <button class="nav-arrow" onclick="triggerNavigate(-1)">&lt;</button>
                <button class="nav-arrow" onclick="triggerNavigate(1)">&gt;</button>
            </div>
        </div>
    </div>

    <script>
        const verbs = [
            { v1: "be", v2: "was/were", v3: "been", tr: "быть" },
            { v1: "bear", v2: "bore", v3: "born(e)", tr: "нести" },
            { v1: "beat", v2: "beat", v3: "beaten", tr: "бить" },
            { v1: "become", v2: "became", v3: "become", tr: "становиться" },
            { v1: "begin", v2: "began", v3: "begun", tr: "начинать" },
            { v1: "bite", v2: "bit", v3: "bitten", tr: "кусать" },
            { v1: "blow", v2: "blew", v3: "blown", tr: "дуть" },
            { v1: "break", v2: "broke", v3: "broken", tr: "ломать" },
            { v1: "bring", v2: "brought", v3: "brought", tr: "приносить" },
            { v1: "build", v2: "built", v3: "built", tr: "строить" },
            { v1: "burn", v2: "burnt", v3: "burnt", tr: "гореть" },
            { v1: "burst", v2: "burst", v3: "burst", tr: "взрываться" },
            { v1: "buy", v2: "bought", v3: "bought", tr: "покупать" },
            { v1: "can", v2: "could", v3: "been able to", tr: "мочь, уметь" },
            { v1: "catch", v2: "caught", v3: "caught", tr: "ловить" },
            { v1: "choose", v2: "chosen", v3: "chosen", tr: "выбирать" },
            { v1: "come", v2: "came", v3: "come", tr: "приходить" },
            { v1: "cost", v2: "cost", v3: "cost", tr: "стоить" },
            { v1: "cut", v2: "cut", v3: "cut", tr: "резать" },
            { v1: "deal", v2: "dealt", v3: "dealt", tr: "иметь дело" },
            { v1: "dig", v2: "dug", v3: "dug", tr: "копать" },
            { v1: "do", v2: "did", v3: "done", tr: "делать" },
            { v1: "draw", v2: "drew", v3: "drawn", tr: "рисовать" },
            { v1: "dream", v2: "dreamt", v3: "dreamt", tr: "мечтать" },
            { v1: "drink", v2: "drank", v3: "drunk", tr: "пить" },
            { v1: "drive", v2: "drove", v3: "driven", tr: "водить" },
            { v1: "eat", v2: "ate", v3: "eaten", tr: "есть" },
            { v1: "fall", v2: "fell", v3: "fallen", tr: "падать" },
            { v1: "feed", v2: "fed", v3: "fed", tr: "кормить" },
            { v1: "feel", v2: "felt", v3: "felt", tr: "чувствовать" },
            { v1: "fight", v2: "fought", v3: "fought", tr: "сражаться" },
            { v1: "find", v2: "found", v3: "found", tr: "находить" },
            { v1: "fly", v2: "flew", v3: "flown", tr: "летать" },
            { v1: "forbid", v2: "forbade", v3: "forbidden", tr: "запрещать" },
            { v1: "forget", v2: "forgot", v3: "forgotten", tr: "забывать" },
            { v1: "forgive", v2: "forgave", v3: "forgiven", tr: "прощать" },
            { v1: "freeze", v2: "froze", v3: "frozen", tr: "замерзать" },
            { v1: "get", v2: "got", v3: "got (gotten)", tr: "получать" },
            { v1: "give", v2: "gave", v3: "given", tr: "давать" },
            { v1: "go", v2: "went", v3: "gone", tr: "идти" },
            { v1: "grow", v2: "grew", v3: "grown", tr: "расти" },
            { v1: "hang", v2: "hung", v3: "hung (hanged)", tr: "вешать" },
            { v1: "have", v2: "had", v3: "had", tr: "иметь" },
            { v1: "hear", v2: "heard", v3: "heard", tr: "слышать" },
            { v1: "hide", v2: "hid", v3: "hidden", tr: "прятать" },
            { v1: "hit", v2: "hit", v3: "hit", tr: "ударять" },
            { v1: "hold", v2: "held", v3: "held", tr: "держать" },
            { v1: "hurt", v2: "hurt", v3: "hurt", tr: "обижать" },
            { v1: "keep", v2: "kept", v3: "kept", tr: "хранить" },
            { v1: "know", v2: "knew", v3: "known", tr: "знать" },
            { v1: "lead", v2: "led", v3: "led", tr: "вести" },
            { v1: "learn", v2: "learnt", v3: "learnt (learned)", tr: "учить(ся)" },
            { v1: "leave", v2: "left", v3: "left", tr: "покидать" },
            { v1: "lend", v2: "lent", v3: "lent", tr: "одалживать" },
            { v1: "let", v2: "let", v3: "let", tr: "позволять" },
            { v1: "light", v2: "lit", v3: "lit", tr: "зажигать" },
            { v1: "lose", v2: "lost", v3: "lost", tr: "терять" },
            { v1: "make", v2: "made", v3: "made", tr: "делать" },
            { v1: "mean", v2: "meant", v3: "meant", tr: "подразумевать" },
            { v1: "meet", v2: "met", v3: "met", tr: "встречать" },
            { v1: "pay", v2: "paid", v3: "paid", tr: "платить" },
            { v1: "put", v2: "put", v3: "put", tr: "класть" },
            { v1: "read", v2: "read", v3: "read", tr: "читать" },
            { v1: "ride", v2: "rode", v3: "ridden", tr: "ехать" },
            { v1: "ring", v2: "rang", v3: "rung", tr: "звонить" },
            { v1: "rise", v2: "rose", v3: "risen", tr: "подниматься" },
            { v1: "run", v2: "ran", v3: "run", tr: "бежать" },
            { v1: "say", v2: "said", v3: "said", tr: "говорить" },
            { v1: "see", v2: "saw", v3: "seen", tr: "видеть" },
            { v1: "sell", v2: "sold", v3: "sold", tr: "продавать" },
            { v1: "send", v2: "sent", v3: "sent", tr: "отправлять" },
            { v1: "set", v2: "set", v3: "set", tr: "устанавливать" },
            { v1: "sew", v2: "sewed", v3: "sewn", tr: "шить" },
            { v1: "shake", v2: "shook", v3: "shaken", tr: "трясти" },
            { v1: "shine", v2: "shone", v3: "shone", tr: "ветить" },
            { v1: "shoot", v2: "shot", v3: "shot", tr: "стрелять" },
            { v1: "show", v2: "showed", v3: "shown", tr: "показывать" },
            { v1: "shut", v2: "shut", v3: "shut", tr: "запирать" },
            { v1: "sing", v2: "sang", v3: "sung", tr: "петь" },
            { v1: "sit", v2: "sat", v3: "sat", tr: "сидеть" },
            { v1: "sleep", v2: "slept", v3: "slept", tr: "спать" },
            { v1: "smell", v2: "smelt", v3: "smelt (smelled)", tr: "пахнуть" },
            { v1: "speak", v2: "spoke", v3: "spoken", tr: "говорить" },
            { v1: "spell", v2: "spelt", v3: "spelt (spelled)", tr: "произносить по буквам" },
            { v1: "spend", v2: "spent", v3: "spent", tr: "тратить" },
            { v1: "stand", v2: "stood", v3: "stood", tr: "стоять" },
            { v1: "steal", v2: "stole", v3: "stolen", tr: "воровать" },
            { v1: "stick", v2: "stuck", v3: "stuck", tr: "приклеивать" },
            { v1: "sting", v2: "stung", v3: "stung", tr: "жалить" },
            { v1: "swear", v2: "swore", v3: "sworn", tr: "клясться" },
            { v1: "sweep", v2: "swept", v3: "swept", tr: "подметать" },
            { v1: "swim", v2: "swam", v3: "swum", tr: "плавать" },
            { v1: "take", v2: "took", v3: "taken", tr: "брать" },
            { v1: "teach", v2: "taught", v3: "taught", tr: "учить" },
            { v1: "tear", v2: "tore", v3: "torn", tr: "рвать" },
            { v1: "tell", v2: "told", v3: "told", tr: "говорить" },
            { v1: "think", v2: "thought", v3: "thought", tr: "думать" },
            { v1: "throw", v2: "threw", v3: "thrown", tr: "бросить" },
            { v1: "understand", v2: "understood", v3: "understood", tr: "понимать" },
            { v1: "wake", v2: "woke", v3: "woken", tr: "просыпаться" },
            { v1: "wear", v2: "wore", v3: "worn", tr: "носиться" },
            { v1: "win", v2: "won", v3: "won", tr: "выигрывать" },
            { v1: "write", v2: "wrote", v3: "written", tr: "писать" }
        ];

        let currentIndex = 0;
        let currentStep = 0; 
        let isAnimating = false;

        const menuScreen = document.getElementById('menuScreen');
        const cardScreen = document.getElementById('cardScreen');
        const verbsGrid = document.getElementById('verbsGrid');
        const searchInput = document.getElementById('searchInput');
        const searchWrapper = document.getElementById('searchWrapper');
        const cardContainer = document.getElementById('cardContainer');

        const f1 = document.getElementById('f1');
        const f2 = document.getElementById('f2');
        const f3 = document.getElementById('f3');
        const transText = document.getElementById('transText');
        const actionBtn = document.getElementById('actionBtn');
        const navContainer = document.getElementById('navContainer');
        const gradeBadge = document.getElementById('gradeBadge');

        function renderMenu() {
            verbsGrid.innerHTML = '';
            verbs.forEach((verb, index) => {
                const btn = document.createElement('button');
                btn.className = 'verb-item-btn';
                
                // Передаем все формы и перевод в атрибуты для комплексного поиска
                btn.setAttribute('data-v1', verb.v1.toLowerCase());
                btn.setAttribute('data-v2', verb.v2.toLowerCase());
                btn.setAttribute('data-v3', verb.v3.toLowerCase());
                btn.setAttribute('data-tr', verb.tr.toLowerCase());
                
                btn.onclick = () => startQuiz(index);
                btn.innerHTML = `<span>${verb.v1}</span>`; // Перевод полностью убран из кнопок
                verbsGrid.appendChild(btn);
            });
        }

        function filterVerbs() {
            const query = searchInput.value.toLowerCase().trim();
            const items = verbsGrid.getElementsByClassName('verb-item-btn');

            for (let item of items) {
                const v1 = item.getAttribute('data-v1');
                const v2 = item.getAttribute('data-v2');
                const v3 = item.getAttribute('data-v3');
                const tr = item.getAttribute('data-tr');
                
                // Поиск проверяет соответствие по 1-й, 2-й, 3-й форме или по переводу
                if (v1.includes(query) || v2.includes(query) || v3.includes(query) || tr.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            }
        }

        function startQuiz(index) {
            menuScreen.classList.remove('active');
            searchWrapper.style.display = 'none'; // Скрываем поиск на экране карточки
            cardScreen.classList.add('active');
            loadVerb(index);
        }

        function showMenu() {
            cardScreen.classList.remove('active');
            searchWrapper.style.display = 'block'; // Возвращаем поиск в меню
            menuScreen.classList.add('active');
            searchInput.value = "";
            filterVerbs();
        }

        function loadVerb(index) {
            currentIndex = index;
            const v = verbs[currentIndex];
            
            f1.innerText = v.v1;
            f2.innerText = v.v2;
            f3.innerText = v.v3;
            transText.innerText = v.tr; // На карточке перевод по-прежнему отображается полноценно

            f1.classList.add('visible');
            f2.classList.remove('visible');
            f3.classList.remove('visible');
            transText.classList.remove('visible');
            gradeBadge.classList.remove('visible');
            
            navContainer.classList.remove('visible');
            actionBtn.style.display = "block";
            actionBtn.innerText = "Показать 2-ю форму";
            currentStep = 0;
        }

        function nextStep() {
            if (currentStep === 0) {
                f2.classList.add('visible');
                actionBtn.innerText = "Показать 3-ю форму";
                currentStep = 1;
            } else if (currentStep === 1) {
                f3.classList.add('visible');
                actionBtn.innerText = "Показать перевод";
                currentStep = 2;
            } else if (currentStep === 2) {
                transText.classList.add('visible');
                gradeBadge.classList.add('visible');
                actionBtn.style.display = "none";
                navContainer.classList.add('visible');
                currentStep = 3;
            }
        }

        function triggerNavigate(direction) {
            if (isAnimating) return;
            isAnimating = true;

            if (direction === 1) {
                cardContainer.classList.add('slide-out-left');
            } else {
                cardContainer.classList.add('slide-out-right');
            }

            setTimeout(() => {
                cardContainer.className = 'card-container';
                if (direction === 1) {
                    cardContainer.classList.add('slide-in-right');
                } else {
                    cardContainer.classList.add('slide-in-left');
                }

                let newIndex = currentIndex + direction;
                if (newIndex >= verbs.length) newIndex = 0;
                if (newIndex < 0) newIndex = verbs.length - 1;
                
                loadVerb(newIndex);

                setTimeout(() => {
                    cardContainer.className = 'card-container';
                    isAnimating = false;
                }, 20);

            }, 200); 
        }

        window.addEventListener('keydown', (e) => {
            if (!cardScreen.classList.contains('active')) return;
            
            if (e.code === 'Space') {
                e.preventDefault();
                if (currentStep < 3) nextStep();
            } else if (e.code === 'ArrowRight' && currentStep === 3) {
                triggerNavigate(1);
            } else if (e.code === 'ArrowLeft' && currentStep === 3) {
                triggerNavigate(-1);
            }
        });

        renderMenu();
    </script>
</body>
</html>
